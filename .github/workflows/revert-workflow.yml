name: Revert Last Post

on:
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  revert-last-post:
    runs-on: ubuntu-latest

    # Give the job permissions to write back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch all history so the script can find the last commit by the bot
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Instagram session
        uses: actions/cache@v4
        with:
          path: session.json
          key: ${{ runner.os }}-instasession-${{ secrets.INSTAGRAM_USERNAME }}

      - name: Run Revert Script
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
        run: python revert_last_post.py

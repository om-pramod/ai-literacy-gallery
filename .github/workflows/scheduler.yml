name: Instagram Post Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9,17 * * *'   # 09:00 & 17:00 UTC

jobs:
  publish-to-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Start n8n container (one-shot)
        run: |
          docker run -d --name n8n \
            -p 5678:5678 \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -e N8N_ENCRYPTION_KEY="${{ secrets.N8N_ENCRYPTION_KEY }}" \
            -e N8N_EMAIL_MODE=smtp \
            -e N8N_SMTP_HOST="${{ secrets.N8N_SMTP_HOST }}" \
            -e N8N_SMTP_PORT="${{ secrets.N8N_SMTP_PORT }}" \
            -e N8N_SMTP_USER="${{ secrets.N8N_SMTP_USER }}" \
            -e N8N_SMTP_PASS="${{ secrets.N8N_SMTP_PASS }}" \
            -e N8N_SMTP_SENDER="${{ secrets.N8N_SMTP_SENDER }}" \
            -e INSTAGRAM_USERNAME="${{ secrets.INSTAGRAM_USERNAME }}" \
            -e INSTAGRAM_PASSWORD="${{ secrets.INSTAGRAM_PASSWORD }}" \
            -e N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false \
            -e N8N_RUNNERS_ENABLED=false \
            n8nio/n8n:latest

      - name: Wait for n8n to be ready
        run: |
          for i in {1..30}; do
            curl -sSf http://localhost:5678/healthz && break
            echo "Waiting for n8n … ($i/30)"
            sleep 2
          done

      - name: Run workflow
        run: |
          docker exec n8n \
            n8n execute --file=/github/workspace/.n8n/workflows/publisher_workflow.json

name: Instagram Post Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9,17 * * *'

jobs:
  publish-to-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure workflow file exists
        run: |
          mkdir -p .n8n/workflows
          test -f .n8n/workflows/publisher_workflow.json || { echo "publisher_workflow.json not found"; exit 1; }

      - name: Publish meme via n8n (session-cookie login)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -e N8N_ENCRYPTION_KEY="${{ secrets.N8N_ENCRYPTION_KEY }}" \
            -e N8N_EMAIL_MODE=smtp \
            -e N8N_SMTP_HOST="${{ secrets.N8N_SMTP_HOST }}" \
            -e N8N_SMTP_PORT="${{ secrets.N8N_SMTP_PORT }}" \
            -e N8N_SMTP_USER="${{ secrets.N8N_SMTP_USER }}" \
            -e N8N_SMTP_PASS="${{ secrets.N8N_SMTP_PASS }}" \
            -e N8N_SMTP_SENDER="${{ secrets.N8N_SMTP_SENDER }}" \
            -e INSTAGRAM_SESSION_COOKIE="${{ secrets.INSTAGRAM_SESSION_COOKIE }}" \
            -e N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false \
            -e N8N_RUNNERS_ENABLED=false \
            n8nio/n8n:latest \
            execute --file=/repo/.n8n/workflows/publisher_workflow.json

name: Instagram Post Publisher

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: '0 9,17 * * *' # 09:00 & 17:00 UTC

jobs:
  publish-to-instagram:
    runs-on: ubuntu-latest

    # Give the job permissions to write back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true # Keep if you use Git LFS for large images
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Cache dependencies to speed up future runs

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Instagram session
        uses: actions/cache@v4
        with:
          path: session.json
          key: ${{ runner.os }}-instasession-${{ secrets.INSTAGRAM_USERNAME }}

      - name: Publish to Reddit
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          SUBREDDIT: ${{ secrets.SUBREDDIT }}
        run: python post_to_reddit.py

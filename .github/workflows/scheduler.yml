name: Instagram Post Scheduler

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    # Runs at 9:00 AM and 5:00 PM UTC. Adjust to your target timezone.
    - cron: '0 9,17 * * *'

jobs:
  publish-to-instagram:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Run n8n workflow
        uses: n8n-io/github-action@v1
        with:
          workflow_file: .n8n/workflows/publisher_workflow.json
          n8n_encryption_key: ${{ secrets.N8N_ENCRYPTION_KEY }}
          n8n_email_mode: smtp
          n8n_smtp_host: ${{ secrets.N8N_SMTP_HOST }}
          n8n_smtp_port: ${{ secrets.N8N_SMTP_PORT }}
          n8n_smtp_user: ${{ secrets.N8N_SMTP_USER }}
          n8n_smtp_pass: ${{ secrets.N8N_SMTP_PASS }}
          n8n_smtp_sender: ${{ secrets.N8N_SMTP_SENDER }}
          instagram_username: ${{ secrets.INSTAGRAM_USERNAME }}
          instagram_password: ${{ secrets.INSTAGRAM_PASSWORD }}
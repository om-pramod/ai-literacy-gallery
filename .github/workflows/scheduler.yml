name: Instagram Post Scheduler

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    # Runs at 9:00 AM and 5:00 PM UTC. Adjust to your target timezone.
    - cron: '0 9,17 * * *'

jobs:
  publish-to-instagram:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Fix workflow file paths
        run: |
          # Update the workflow JSON to use correct paths
          sed -i 's|/data/captions/to_post/|/github/workspace/captions/to_post/|g' .n8n/workflows/publisher_workflow.json
          sed -i 's|/data/memes/|/github/workspace/memes/|g' .n8n/workflows/publisher_workflow.json
          sed -i 's|/instagram_content|/github/workspace|g' .n8n/workflows/publisher_workflow.json

      - name: Run n8n workflow  
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/github/workspace \
            -e N8N_ENCRYPTION_KEY="${{ secrets.N8N_ENCRYPTION_KEY }}" \
            -e N8N_EMAIL_MODE=smtp \
            -e N8N_SMTP_HOST="${{ secrets.N8N_SMTP_HOST }}" \
            -e N8N_SMTP_PORT="${{ secrets.N8N_SMTP_PORT }}" \
            -e N8N_SMTP_USER="${{ secrets.N8N_SMTP_USER }}" \
            -e N8N_SMTP_PASS="${{ secrets.N8N_SMTP_PASS }}" \
            -e N8N_SMTP_SENDER="${{ secrets.N8N_SMTP_SENDER }}" \
            -e INSTAGRAM_USERNAME="${{ secrets.INSTAGRAM_USERNAME }}" \
            -e INSTAGRAM_PASSWORD="${{ secrets.INSTAGRAM_PASSWORD }}" \
            -e N8N_SKIP_WEBHOOK_DEREGISTRATION_SHUTDOWN=true \
            n8nio/n8n:latest \
            sh -c "n8n import:workflow --input /github/workspace/.n8n/workflows/publisher_workflow.json && sleep 2 && WORKFLOW_ID=\$(n8n list:workflow --output=json | jq -r '.[0].id' 2>/dev/null || echo '1') && n8n execute --id \$WORKFLOW_ID"
